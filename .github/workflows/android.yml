name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to attach the APK to a release when a v* tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          SERVER_URL: ${{ vars.AUTOCORRECT_SERVER_URL }}
        run: |
          EXTRA=""
          if [ -n "$SERVER_URL" ]; then EXTRA="-PautocorrectServerUrl=$SERVER_URL"; fi
          ./gradlew assembleDebug $EXTRA --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: autocorrect-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk Autocorrect.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/Autocorrect.apk
