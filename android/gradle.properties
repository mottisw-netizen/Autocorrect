org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Address of your Autocorrect server (customers only type their access code).
autocorrectServerUrl=https://YOUR-SERVER-ADDRESS
# Default method for new installs: "server" (access code) or "own_key" (customer's own AI key).
autocorrectDefaultMode=server
# Default model for "own key" mode (e.g. a model id from openrouter.ai/models). Users can change it.
autocorrectDefaultModel=
